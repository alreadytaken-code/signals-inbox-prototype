<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signals Inbox · prototype</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mute:#667085;--line:#e3e7ee;--acc:#2457d6;--acc-ink:#fff;--ok:#157347;--warn:#b25e09;--bad:#b42318;--chip:#eaf0ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1a2029;--ink:#e8ecf2;--mute:#9aa4b2;--line:#2a323d;--acc:#6b93ff;--acc-ink:#0d1320;--ok:#4cc38a;--warn:#f0a04b;--bad:#ff7b6e;--chip:#222c44}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1a2029;--ink:#e8ecf2;--mute:#9aa4b2;--line:#2a323d;--acc:#6b93ff;--acc-ink:#0d1320;--ok:#4cc38a;--warn:#f0a04b;--bad:#ff7b6e;--chip:#222c44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--mute)}
label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;color:inherit;font:inherit;cursor:pointer}
.row:hover{border-color:var(--acc)}
.row:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chip{background:var(--chip);color:var(--acc);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.grow{flex:1;min-width:0}
.acct{font-weight:600}
.meta{color:var(--mute);font-size:13px}
.st{font-size:12px;font-weight:600}
.st.new{color:var(--acc)}.st.actioned{color:var(--ok)}.st.dismissed{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.back{background:none;border:0;color:var(--acc);font:inherit;cursor:pointer;padding:0;margin-bottom:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line)}
.pill.pending{color:var(--warn)}.pill.synced{color:var(--ok)}.pill.failed{color:var(--bad)}
.empty{text-align:center;padding:40px 12px;color:var(--mute)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:none;gap:12px;align-items:center;max-width:92%}
#toast button{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.err{color:var(--bad);border:1px solid var(--bad);border-radius:8px;padding:8px 12px;margin-top:12px;font-weight:600}
.err:empty{display:none}
dl{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;margin:12px 0 0}
dt{color:var(--mute)}dd{margin:0}
</style>
</head>
<body>
<main>
<h1>Signals Inbox</h1>
<p class="sub">Mock data only. Signals as of last night's run. Logged in as Vincenzo (rep).</p>
<div class="bar">
<span id="count"></span>
<span>
<label><input type="checkbox" id="showDis"> Show dismissed</label>
&nbsp;
<label><input type="checkbox" id="fail"> Simulate failures</label>
</span>
</div>
<div id="view"></div>
</main>
<div id="toast" role="status"></div>
<script>
const S=[
{id:1,type:"Funding round",acct:"Northwind Logistics",date:"Today",info:"Raised a Series B of $24M.",contact:"Elena Rossi, Head of Sales",st:"new"},
{id:2,type:"Job change",acct:"Helio Energy",date:"Today",info:"New VP Sales joined 2 weeks ago.",contact:"Marco Bianchi, VP Sales",st:"new"},
{id:3,type:"Hiring",acct:"Brightlane",date:"Yesterday",info:"Opened 6 SDR roles this week.",contact:null,st:"new"},
{id:4,type:"Website visit",acct:"Orbit Foods",date:"Yesterday",info:"Pricing page viewed 4 times.",contact:"Luca Verdi, Ops Manager",st:"new"},
{id:5,type:"Funding round",acct:"Kite Mobility",date:"2 days ago",info:"Announced a seed extension.",contact:null,st:"new"},
{id:6,type:"Job change",acct:"Delta Print",date:"3 days ago",info:"Head of Marketing moved on.",contact:"Sara Neri, CMO",st:"actioned",task:true,enrolled:true,sync:"synced"}
];
let sel=null,toastT=null,busy={};
const $=q=>document.querySelector(q),v=$("#view"),fail=()=>$("#fail").checked;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(msg,undo){const t=$("#toast");t.innerHTML="<span></span>";t.firstChild.textContent=msg;
if(undo){const b=document.createElement("button");b.textContent="Undo";b.onclick=()=>{undo();t.style.display="none"};t.appendChild(b)}
t.style.display="flex";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",5000)}
function list(){
const show=$("#showDis").checked,L=S.filter(s=>show||s.st!=="dismissed");
$("#count").textContent=S.filter(s=>s.st==="new").length+" new signals";
if(!L.length){v.innerHTML='<div class="empty"><b>Inbox is clear.</b><br>New signals show up here after tonight\'s run.</div>';return}
v.innerHTML="";L.forEach(s=>{const b=document.createElement("button");b.className="row";
b.innerHTML='<span class="chip"></span><span class="grow"><div class="acct"></div><div class="meta"></div></span><span class="st"></span>';
b.querySelector(".chip").textContent=s.type;b.querySelector(".acct").textContent=s.acct;
b.querySelector(".meta").textContent=s.date+" · "+s.info;
const st=b.querySelector(".st");st.textContent=s.st;st.className="st "+s.st;
b.onclick=()=>{sel=s.id;detail()};v.appendChild(b)})}
function detail(){
const s=S.find(x=>x.id===sel);
const noC=!s.contact,done=s.st!=="new";
v.innerHTML='<button class="back">‹ Back to inbox</button><div class="card"><span class="chip"></span><h2 style="margin:10px 0 2px"></h2><div class="meta"></div><dl></dl><div class="acts"></div><div class="note"></div><div class="err" role="alert"></div></div>';
v.querySelector(".chip").textContent=s.type;v.querySelector("h2").textContent=s.acct;v.querySelector(".meta").textContent=s.date;
v.querySelector(".back").onclick=()=>{sel=null;list()};
v.querySelector("dl").innerHTML="<dt>Signal</dt><dd></dd><dt>Contact</dt><dd></dd><dt>Status</dt><dd></dd>";
const dd=v.querySelectorAll("dd");dd[0].textContent=s.info;dd[1].textContent=s.contact||"No contact linked to this signal";
dd[2].innerHTML='<span class="st '+s.st+'"></span>'+(s.sync?' <span class="pill '+s.sync+'"></span>':"");
dd[2].querySelector(".st").textContent=s.st;
if(s.sync){const p=dd[2].querySelector(".pill");p.textContent="HubSpot: "+s.sync}
const A=v.querySelector(".acts"),N=v.querySelector(".note");
const mk=(t,c,f,dis)=>{const b=document.createElement("button");b.className="btn "+c;b.textContent=t;b.disabled=!!dis;b.onclick=f;A.appendChild(b);return b};
mk(s.task?"Task created":(busy[s.id]?"Creating…":"Create task"),"pri",()=>createTask(s),s.task||busy[s.id]);
if(s.task&&!busy[s.id])mk("Undo task","",()=>resetTask(s));
const seqBtn=mk(s.enrolled?"Enrolled":"Enroll in sequence","",()=>enroll(s),noC);
mk("Dismiss","",()=>dismiss(s),s.st==="dismissed");
v.querySelector(".err").textContent=s.err||"";
if(noC)N.textContent="Sequences work on contacts only. This signal is linked to the account, so enrolling is off.";
if(s.task)N.textContent="1 task linked to this signal.";
if(s.st==="dismissed"){A.lastChild.textContent="Dismissed";const u=mk("Restore","",()=>{s.st="new";detail()})}}
async function createTask(s){
if(s.task||busy[s.id])return;s.err="";busy[s.id]=true;detail();
await sleep(700);busy[s.id]=false;
if(fail()){s.err="Couldn't create the task. The signal is still new, try again.";toast(s.err);detail();return}
s.task=true;s.st="actioned";s.sync="pending";detail();toast("Task created");
await sleep(1800);if(!s.task)return;s.sync=fail()?"failed":"synced";if(sel===s.id)detail()}
function resetTask(s){s.task=false;s.sync=null;s.err="";s.st=s.enrolled?"actioned":"new";detail();toast("Task removed. Signal is "+s.st+" again.")}
function enroll(s){
if(!s.contact)return;
if(s.enrolled){toast(s.contact.split(",")[0]+" is already in this sequence");return}
if(fail()){s.err="Couldn't enroll in the sequence. Try again.";toast(s.err);detail();return}
s.err="";
s.enrolled=true;if(s.st==="new")s.st="actioned";detail();toast("Enrolled in sequence")}
function dismiss(s){const prev=s.st;s.st="dismissed";sel=null;list();
toast("Signal dismissed",()=>{s.st=prev==="dismissed"?"new":prev;list()})}
$("#showDis").onchange=()=>{if(!sel)list()};
list();
</script>
</body>
</html>
